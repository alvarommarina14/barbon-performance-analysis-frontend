appId: com.barbonperformance.analysis.coach
productName: Barbon Performance Analysis Coach
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  # The window icon is read at runtime; build resources are otherwise left out of the app.
  - resources/icon.png
asarUnpack:
  - resources/icon.png
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.sports
linux:
  target: AppImage
  category: Sports
